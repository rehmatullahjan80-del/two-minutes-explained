siteName: 2 Minutes Explained
tagline: Hard computer networking ideas explained in two minutes, with written notes so they stay with you.
about: |-
  2 Minutes Explained turns computer networking ideas into short, story-style videos that anyone can follow, with no jargon.

  Each video has its own page here, with the same video and written notes underneath. Use them to revise, to recall a topic you watched a while ago, or to read instead of watch.

  It's made for people starting a networking career, students, the curious, and anyone starting ethical hacking who needs the basics first.
