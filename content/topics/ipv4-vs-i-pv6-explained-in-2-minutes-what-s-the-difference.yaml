definition: >-
  IPv4 uses 32-bit IP addresses with a limited address space, while IPv6 uses
  128-bit addresses to provide an enormously larger number of addresses for the
  growing internet.
notes: >-
  IPv4 vs IPv6

  The main difference is the number of available addresses and their format.

  IPv4: Uses 32-bit addresses, written as four decimal numbers separated by
  dots.

  IPv6: Uses 128-bit addresses, written in hexadecimal and separated by colons.

  Think of IPv4 as an old city running out of house addresses as its population
  grows. IPv6 is like creating a much larger addressing system with an enormous
  number of available addresses.

  Why Is the Internet Moving Toward IPv6?

  As more devices connect to the internet, the limited IPv4 address space
  becomes a challenge. IPv6 provides a long-term solution by offering a vastly
  larger pool of addresses.

  However, IPv4 isn't disappearing overnight. Both IPv4 and IPv6 are still in
  use, and many modern networks support both. The transition is gradual because
  the entire internet cannot switch to a new protocol all at once.
keyPoints:
  - >-
    IPv4: Uses 32-bit addresses and provides around 4.3 billion possible
    addresses.
  - >-
    IPv6: Uses 128-bit addresses and provides an enormously larger address
    space.
  - >-
    Both Are Still in Use: The internet is gradually adopting IPv6 while IPv4
    continues to operate.
